{% extends 'base.html' %}

{% block content %}
<article>
    <header>
        <h1>{% if promo %}Редактирование{% else %}Создание{% endif %} промокода</h1>
    </header>

    <form method="post">
        {% csrf_token %}
        
        <p>
            <label for="id-code">Код промокода:</label><br>
            <input type="text" id="id-code" name="code" value="{{ promo.code }}" placeholder="Например: СКИДКА2024" required>
        </p>

        <p>
            <label for="id-discount">Размер скидки (%):</label><br>
            <input type="number" id="id-discount" name="discount" value="{{ promo.discount }}" min="1" max="100" required>
        </p>

        <p>
            <label for="id-expiry">Срок действия до:</label><br>
            <input type="date" id="id-expiry" name="expiry_date" value="{{ promo.expiry_date|date:'Y-m-d' }}" required>
        </p>

        {% if promo %}
        <p>
            <label>
                <input type="checkbox" name="is_active" {% if promo.is_active %}checked{% endif %}>
                Активен
            </label>
        </p>
        {% endif %}

        <button type="submit">Сохранить промокод</button>
    </form>

    <p><a href="{% url 'promocodes' %}">Отмена и возврат к списку</a></p>
</article>
{% endblock %}
